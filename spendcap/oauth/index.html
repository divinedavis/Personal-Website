<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returning to Spendcap</title>
    <meta name="robots" content="noindex">
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: #f2f2f7;
            color: #1c1c1e;
            padding: 24px;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #000; color: #f2f2f7; }
            .card { background: #1c1c1e !important; }
            .muted { color: #98989d !important; }
        }
        .card {
            background: #fff;
            border-radius: 18px;
            padding: 32px 28px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 2px 18px rgba(0,0,0,.08);
        }
        h1 { font-size: 1.35rem; margin: 0 0 10px; }
        p { margin: 0 0 8px; line-height: 1.5; }
        .muted { color: #6b6b70; font-size: .92rem; }
        .ring {
            width: 46px; height: 46px; margin: 0 auto 18px;
            border-radius: 50%;
            border: 4px solid #34a853;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="ring" role="img" aria-label="Returning to the app"></div>
        <h1>Returning to Spendcap&hellip;</h1>
        <p class="muted">
            Your bank sent you back here to finish connecting. Spendcap should
            reopen automatically.
        </p>
        <p class="muted">
            If it didn&rsquo;t, open Spendcap from your Home Screen and start the
            bank connection again.
        </p>
    </div>
</body>
</html>
