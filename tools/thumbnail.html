<!DOCTYPE html>
<!-- Template for the LinkedIn Featured thumbnail. make_thumbnail.py substitutes
     the {{TOKENS}} with live numbers and screenshots this file; it is not served
     to visitors and is never linked from the site.

     Everything is centred on purpose. LinkedIn shows a Featured link at 1.91:1
     in some surfaces and crops it toward 4:3 in the profile grid, which eats
     roughly 180px off each side. A left-aligned domain or a corner logo would
     survive one layout and vanish in the other, so the composition stays inside
     the centre 840px where both crops agree. -->
<html>
<head>
<meta charset="utf-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* The canvas is the exact export size, so the screenshot needs no cropping. */
    body {
        width: 1200px;
        height: 627px;
        background: #0f1115;
        font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont,
                     'Helvetica Neue', sans-serif;
        color: #f2f4f8;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Two soft off-canvas glows in the site's link and AI accent colours. They
       keep a flat dark rectangle from reading as a broken image in the feed. */
    body::before,
    body::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
    }
    body::before {
        width: 620px; height: 620px;
        top: -300px; left: -180px;
        background: rgba(111, 176, 255, 0.20);
    }
    body::after {
        width: 560px; height: 560px;
        bottom: -300px; right: -140px;
        background: rgba(180, 154, 255, 0.18);
    }

    .accent-bar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 6px;
        background: linear-gradient(90deg, #6fb0ff 0%, #b49aff 100%);
    }

    .card {
        position: relative;
        text-align: center;
        width: 840px;          /* the crop-safe centre */
    }

    .name {
        font-size: 68px;
        font-weight: 700;
        letter-spacing: 0.02em;
        line-height: 1.05;
    }

    .role {
        margin-top: 14px;
        font-size: 25px;
        font-weight: 400;
        color: #a8aeba;
    }

    .rule {
        width: 90px;
        height: 3px;
        margin: 34px auto;
        border-radius: 2px;
        background: linear-gradient(90deg, #6fb0ff 0%, #b49aff 100%);
    }

    /* Equal-width columns rather than equal gaps. "517,912" is three times the
       width of "22", so a gap-based row centres by arithmetic but reads as
       left-heavy; fixed columns put the three labels on an even rhythm. */
    .stats {
        display: flex;
        justify-content: center;
    }

    .stats > div { width: 268px; }

    /* Tabular figures so the three numbers sit on a shared baseline grid
       instead of drifting with digit widths. */
    .stat-value {
        font-size: 52px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        color: #f2f4f8;
    }

    .stat-label {
        margin-top: 10px;
        font-size: 17px;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #868d99;
    }

    /* Two pills, not one. The site is the destination and the GitHub handle is
       the receipt for the numbers above it — a stats card that cites nothing
       is just a claim. */
    .links {
        margin-top: 44px;
        display: flex;
        justify-content: center;
        gap: 18px;
    }

    .pill {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        padding: 12px 26px;
        border: 1px solid #333944;
        border-radius: 999px;
        background: rgba(23, 26, 33, 0.7);
        font-size: 22px;
        font-weight: 600;
        line-height: 1;
    }

    .pill-site { color: #6fb0ff; }
    .pill-gh   { color: #c9ced8; }

    .pill .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #3fb950;
    }

    .pill svg {
        width: 22px;
        height: 22px;
        fill: #c9ced8;
    }
</style>
</head>
<body>
    <div class="accent-bar"></div>

    <div class="card">
        <div class="name">Divine Davis</div>
        <div class="role">Engineer &middot; Technical Program Manager</div>

        <div class="rule"></div>

        <div class="stats">
            <div>
                <div class="stat-value">{{CONTRIBUTIONS}}</div>
                <div class="stat-label">Commits / yr</div>
            </div>
            <div>
                <div class="stat-value">{{LOC}}</div>
                <div class="stat-label">Lines of code</div>
            </div>
            <div>
                <div class="stat-value">{{APPS}}</div>
                <div class="stat-label">Apps shipped</div>
            </div>
        </div>

        <div class="links">
            <div class="pill pill-site"><span class="dot"></span>divinedavis.com</div>
            <!-- GitHub's official mark, inlined. A remote <img> would render as
                 a broken box: Chrome screenshots this file from disk. -->
            <div class="pill pill-gh">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
                github.com/divinedavis
            </div>
        </div>
    </div>
</body>
</html>
