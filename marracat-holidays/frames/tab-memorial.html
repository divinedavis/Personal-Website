<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><base href="../"><style>
@property --a { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
:root { --ink:#0A0A0A; --muted:#6b6b6b; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--ink); font-family: -apple-system, 'Helvetica Neue', sans-serif; }
.device { position: relative; width: 390px; height: 300px; overflow: hidden; background: #fff; }
.content { padding: 18px; }
.card { height: 120px; border-radius: 14px; background: #ececec; }
.row { display: flex; gap: 10px; margin-top: 12px; } .row i { flex: 1; height: 90px; border-radius: 10px; background: #f2f2f2; }
.bar { position: absolute; left: 20px; right: 20px; bottom: 30px; height: 62px; border-radius: 31.0px; }
.body { position: absolute; inset: 0; border-radius: inherit; background: rgba(45,46,49,.94);
        box-shadow: 0 5px 14px rgba(0,0,0,.3), inset 0 0 0 1px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.07); }
.tabs { position: absolute; inset: 5px; display: flex; }
.tab { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; z-index: 2; }
.pill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 30px; z-index: 1; animation: pill 6.5s linear infinite; }
.pill-color { background-size: 170% 100% !important; animation: pill 6.5s linear infinite, drift 4s linear infinite;
              box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.pill-color::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: rgba(0,0,0,.18); }
.trail { position: absolute; top: 6px; bottom: 6px; left: 0; border-radius: 30px; filter: blur(8px); z-index: 0; background-size: 300% 100% !important;
         animation: pill 6.5s linear infinite, trail 6.5s linear infinite; }
.ribbon { position: absolute; left: 30px; right: 30px; top: 4px; height: 3.5px; border-radius: 2px; background-size: 200% 100% !important;
          animation: drift 3s linear infinite; z-index: 3; }
.edge { position: absolute; inset: -2px; border-radius: 33.0px; animation: spin 5s linear infinite;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 2.5px; }
.glow { position: absolute; inset: 4px 10px -4px; border-radius: 31.0px; filter: blur(14px); opacity: .8; animation: spin 5s linear infinite; }
@keyframes drift { from { background-position: 0% 50%; } to { background-position: 150% 50%; } }
@keyframes spin { to { --a: 360deg; } }
@keyframes pill { 0.00% { transform: translateX(0.0px); } 14.46% { transform: translateX(0.0px); animation-timing-function: cubic-bezier(.3,1.25,.5,1); } 20.00% { transform: translateX(68.0px); } 34.46% { transform: translateX(68.0px); animation-timing-function: cubic-bezier(.3,1.25,.5,1); } 40.00% { transform: translateX(136.0px); } 54.46% { transform: translateX(136.0px); animation-timing-function: cubic-bezier(.3,1.25,.5,1); } 60.00% { transform: translateX(204.0px); } 74.46% { transform: translateX(204.0px); animation-timing-function: cubic-bezier(.3,1.25,.5,1); } 80.00% { transform: translateX(272.0px); } 94.46% { transform: translateX(272.0px); animation-timing-function: cubic-bezier(.3,1.25,.5,1); } 100% { transform: translateX(0); } }
@keyframes trail { 0% { opacity: 0; } 14.46% { opacity: 0; } 19.15% { opacity: .55; } 23.85% { opacity: 0; } 34.46% { opacity: 0; } 39.15% { opacity: .55; } 43.85% { opacity: 0; } 54.46% { opacity: 0; } 59.15% { opacity: .55; } 63.85% { opacity: 0; } 74.46% { opacity: 0; } 79.15% { opacity: .55; } 83.85% { opacity: 0; } 94.46% { opacity: 0; } 99.15% { opacity: .55; } 103.85% { opacity: 0; } 100% { opacity: 0; } }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-family: Futura, sans-serif; font-weight: 500; letter-spacing: .18em; font-size: 28px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 30px 0 4px; }
.lede { color: var(--muted); margin: 0 0 18px; max-width: 800px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px 18px; }
.cell { display: flex; flex-direction: column; align-items: center; }
.frame { width: 261px; height: 202px; border-radius: 16px; overflow: hidden; border: 2px solid #111; }
.frame .device { transform: scale(.66); transform-origin: top left; }
.cap { font-size: 13px; font-weight: 600; margin-top: 8px; text-align: center; }
.when { font-size: 11.5px; color: var(--muted); text-align: center; }
