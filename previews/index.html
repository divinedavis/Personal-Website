<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App previews</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:#1c1c1e; color:#fff; font:15px -apple-system, "SF Pro Text", system-ui, sans-serif; display:flex; flex-direction:column; }
  /* the app filter: a frosted bar floating over the top of the preview */
  .bar { flex:none; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 16px; border-bottom:1px solid #2c2c2e; position:relative; }
  .filter { font:inherit; font-size:14px; font-weight:600; color:#fff; background:#2c2c2e; border:1px solid #3a3a3c; border-radius:20px;
            padding:7px 14px 7px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .filter svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
  .menu { position:absolute; top:52px; left:50%; translate:-50% 0; z-index:10; min-width:220px; padding:6px; border-radius:16px; display:none;
          background:rgba(40,44,48,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
          box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 .5px rgba(255,255,255,.14), 0 8px 24px rgba(0,0,0,.45); }
  .menu.open { display:block; }
  .menu button { display:flex; width:100%; justify-content:space-between; font:inherit; color:#fff; background:none; border:0; border-radius:10px; padding:9px 12px; cursor:pointer; text-align:left; }
  .menu button:hover { background:rgba(255,255,255,.08); }
  .menu button.on::after { content:"✓"; color:#A8DCE6; }
  .arrows { display:flex; gap:6px; }
  .arrows button { font:inherit; width:34px; height:34px; border-radius:17px; color:#fff; background:#2c2c2e; border:1px solid #3a3a3c; cursor:pointer; }
  iframe { flex:1; width:100%; border:0; background:#1c1c1e; }
</style>
</head>
<body>
  <div class="bar">
    <div class="arrows"><button id="prev" aria-label="Previous app">‹</button></div>
    <button class="filter" id="filter" aria-haspopup="true">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span id="name"></span>
    </button>
    <div class="arrows"><button id="next" aria-label="Next app">›</button></div>
    <div class="menu" id="menu" role="menu"></div>
  </div>
  <iframe id="view" title="App preview"></iframe>
<script>
// One entry per app preview kept in this folder. Add a line to add an app.
const apps = [
  { name: "Find A Crib", file: "findacrib-preview.html" },
  { name: "Find A Crib holidays", file: "findacrib-holidays.html" },
  { name: "Marracat",    file: "marracat-preview.html" },
  { name: "Milepost",    file: "milepost-preview.html" },
  { name: "Milepost holidays", file: "milepost-holidays.html" },
];
const view = document.getElementById("view"), menu = document.getElementById("menu");
let cur = 0;
try { cur = Math.max(0, apps.findIndex(a => a.name === decodeURIComponent(location.hash.slice(1)))); } catch (e) {}
function show(i) {
  cur = (i + apps.length) % apps.length;
  view.src = apps[cur].file;
  document.getElementById("name").textContent = apps[cur].name;
  menu.querySelectorAll("button").forEach((b, j) => b.classList.toggle("on", j === cur));
  history.replaceState(null, "", "#" + encodeURIComponent(apps[cur].name));
  menu.classList.remove("open");
}
menu.innerHTML = apps.map((a, i) => `<button role="menuitem" data-i="${i}">${a.name}</button>`).join("");
menu.querySelectorAll("button").forEach(b => b.onclick = () => show(+b.dataset.i));
document.getElementById("filter").onclick = e => { e.stopPropagation(); menu.classList.toggle("open"); };
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.addEventListener("click", () => menu.classList.remove("open"));
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") show(cur - 1); if (e.key === "ArrowRight") show(cur + 1); if (e.key === "Escape") menu.classList.remove("open"); });
show(cur);
</script>
</body>
</html>
